<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshardham Associates — Expense & Cash Register</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EA5B22">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#EA5B22; --orange-dark:#c9501f; --gold:#F5A623; --charcoal:#3a3a3c; --ink:#1f2124;
  --bg:#f4f5f7; --card:#ffffff; --line:#e7e8ec; --muted:#7a7d85;
  --green:#1f9d55; --red:#d64545;
  --shadow:0 1px 2px rgba(20,22,28,.04),0 8px 24px rgba(20,22,28,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}

/* Header */
header{display:flex;align-items:center;gap:14px;padding:6px 2px 18px}
.logo{display:flex;align-items:center;gap:11px}
.mark{width:48px;height:48px;border-radius:11px;object-fit:cover;display:block;flex:none;
  box-shadow:0 6px 16px rgba(234,91,34,.28)}
.brand b{font-family:Poppins;font-weight:700;font-size:19px;letter-spacing:.2px;display:block;color:var(--ink)}
.brand small{color:var(--muted);font-size:12.5px;letter-spacing:.3px;text-transform:uppercase}

/* Balance */
.balance{background:linear-gradient(135deg,var(--charcoal),#26272a);color:#fff;border-radius:18px;
  padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.balance .lbl{font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.7}
.balance .amt{font-family:Poppins;font-weight:700;font-size:38px;margin:2px 0 0;line-height:1.1}
.balance .amt .rs{opacity:.6;font-weight:600;font-size:24px;margin-right:4px}
.stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.stat b{display:block;font-family:Poppins;font-weight:600;font-size:16px}
.stat span{font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;opacity:.65}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{margin:0 0 16px;font-family:Poppins;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* Segmented toggle */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:600;
  color:var(--muted);cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button.on.exp{color:var(--red)} .seg button.on.cash{color:var(--green)}
.oseg{margin-bottom:14px} .oseg button.on{color:var(--orange)}

/* Form */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12.5px;font-weight:600;color:var(--charcoal)}
label .opt{color:var(--muted);font-weight:400}
label .req{color:var(--orange)}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1.4px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,98,44,.12)}
textarea{resize:vertical;min-height:52px}
.amtbox{position:relative}
.amtbox input{padding-left:30px;font-weight:600}
.amtbox .rs{position:absolute;left:12px;top:11px;color:var(--muted)}
.save{margin-top:18px;width:100%;border:0;background:linear-gradient(135deg,var(--orange),var(--gold));color:#fff;font:inherit;font-weight:600;
  font-size:15.5px;padding:14px;border-radius:12px;cursor:pointer;box-shadow:0 6px 16px rgba(234,91,34,.3)}
.save:hover{filter:brightness(.96)}
.save:active{transform:translateY(1px)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.hint b{color:var(--charcoal)}

/* Table */
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1.4px solid var(--line);background:#fff;color:var(--charcoal);font:inherit;font-weight:600;font-size:13.5px;
  padding:12px 16px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.tscroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.amt-exp{color:var(--red);font-weight:600;white-space:nowrap}
.amt-cash{color:var(--green);font-weight:600;white-space:nowrap}
.sub{color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}
.del:hover{background:#fdecec;color:var(--red)}
@media(max-width:560px){.grid{grid-template-columns:1fr}.balance .amt{font-size:32px}}
</style>

<div class="wrap">
  <header>
    <div class="logo">
      <img class="mark" src="icon.svg" alt="Akshardham Associates logo">
      <div class="brand"><b>Akshardham Associates</b><small>Office Expense Register · HR</small></div>
    </div>
    <button id="installBtn" class="btn" style="margin-left:auto;display:none">⬇ Install App</button>
  </header>

  <div class="seg oseg">
    <button type="button" id="oKota" class="on" onclick="setOffice('kota')">🏢 Kota</button>
    <button type="button" id="oJhal" onclick="setOffice('jhalawar')">🏭 Jhalawar</button>
    <button type="button" id="oSal" onclick="setOffice('salary')">💰 Salary</button>
  </div>

  <div class="balance">
    <div class="lbl" id="balLbl">Cash in Hand</div>
    <div class="amt"><span class="rs">₹</span><span id="bal">0</span></div>
    <div class="stats">
      <div class="stat"><b id="sRecv">₹0</b><span>Received (total)</span></div>
      <div class="stat"><b id="sKota">₹0</b><span>Kota Spent</span></div>
      <div class="stat"><b id="sJhal">₹0</b><span>Jhalawar Spent</span></div>
      <div class="stat"><b id="sCount">0</b><span>Entries shown</span></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>New Entry</h2>
    <div class="seg">
      <button type="button" id="tExp" class="on exp" onclick="setType('expense')">− Expense (Kharcha)</button>
      <button type="button" id="tCash" class="cash" onclick="setType('cashin')">+ Cash In (Paisa Aaya)</button>
    </div>
    <div class="hint" id="cashNote" hidden style="margin:-6px 0 12px">💰 Cash dono office ke liye common hai — Kota se add hoga.</div>

    <form id="f" onsubmit="return save(event)">
      <div class="grid">
        <div class="field">
          <label>Date <span class="req">*</span></label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label>Amount (₹) <span class="req">*</span></label>
          <div class="amtbox"><span class="rs">₹</span><input type="number" id="amount" min="0" step="1" placeholder="0" required></div>
        </div>

        <div class="field expense-only">
          <label>Category <span class="req">*</span></label>
          <select id="category">
            <option value="Milk & Grocery">Milk &amp; Grocery (Dudh, Chai, Shakkar)</option>
            <option value="Refreshment">Refreshment (Tea/Coffee)</option>
            <option value="Petrol">Petrol Expenses</option>
            <option value="SIM Recharge">SIM / Mobile Recharge</option>
            <option value="Money Transfer">Money Transfer</option>
            <option value="Stationery">Stationery Items</option>
            <option value="Housekeeping">Housekeeping Items</option>
            <option value="Repairing">Repairing / Maintenance</option>
            <option value="Reimbursement">Reimbursement</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div class="field">
          <label id="itemLbl">Item / Particulars <span class="req">*</span></label>
          <input type="text" id="item" placeholder="e.g. A4 paper, Petrol, Tea" required>
        </div>

        <div class="field expense-only">
          <label>Employee <span class="opt">(optional — pick or type)</span></label>
          <input type="text" id="employee" list="empList" placeholder="e.g. Sunil Meghwal">
          <datalist id="empList">
            <option value="Sunil Meghwal">Sunil Meghwal — Jhalawar office</option>
          </datalist>
        </div>
        <div class="field expense-only">
          <label>Source / Shop <span class="opt">(optional)</span></label>
          <input type="text" id="source" placeholder="e.g. Sharma Store">
        </div>

        <div class="field full">
          <label>Remark / Reason <span class="opt">(optional)</span></label>
          <textarea id="remark" placeholder="e.g. Petrol for bank + market visit"></textarea>
        </div>
      </div>
      <button class="save" id="saveBtn">Save Entry</button>
      <div class="hint" id="syncHint"></div>
    </form>
  </div>

  <div class="card">
    <div class="tbar">
      <h2 style="margin:0"><span class="dot"></span>Entries</h2>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn" onclick="loadFromSheet()" title="Refresh from Google Sheet">🔄 Refresh</button>
        <select id="monthFilter" class="btn" onchange="render()"></select>
        <button type="button" class="btn" onclick="exportCSV()">⬇ Export Excel</button>
      </div>
    </div>
    <div class="tscroll">
      <table>
        <thead><tr><th>Date</th><th>Details</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — paste your Google Sheet Web App URL here (see Code.gs).
   Leave empty to run offline (saves in this browser only).
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeSsDeGkQG0RYb-Bx5u7ACqIk3vpmRposDuLk5b1Z5vP2Cdju3O6_MDmVBzyEczSGK/exec";

/* Opening cash already in the account (same as setStartingCash in the Sheet). Display-only; never sent to the Sheet. */
const OPENING_CASH = 1113;

const CAT_COLORS = {
  'Milk & Grocery':['#fff4e6','#e8590c'], Refreshment:['#fff0f6','#c2255c'],
  Petrol:['#fff2e6','#d9480f'], 'SIM Recharge':['#e7f5ff','#1971c2'],
  'Money Transfer':['#ebfbee','#2f9e44'], Stationery:['#eef3ff','#3b5bdb'],
  Housekeeping:['#e9f8ef','#1f9d55'], Repairing:['#fff9db','#a37500'],
  Reimbursement:['#f3edff','#7048e8'], Others:['#eef1f4','#495057'],
  'Cash In':['#e6fcf5','#0ca678'], 'Salary Expences':['#e6fcf5','#0ca678'], 'Salary Paid':['#fff0f6','#c2255c']
};
const rupee = n => '₹' + (Number(n)||0).toLocaleString('en-IN');
const KEY = 'akshardham_expenses';
let entries = JSON.parse(localStorage.getItem(KEY) || '[]');   // cache of the shared Sheet data (offline fallback)
let sheetBalance = null;   // authoritative shared balance from the Sheet (null until first load)
let type = 'expense';
let office = 'kota';   // which office tab this view + new entry belongs to

document.getElementById('date').valueAsDate = new Date();

/* Pull the SHARED data from the Sheet so every device shows the same entries + balance. */
function loadFromSheet(){
  if(!SCRIPT_URL) return;
  const h = document.getElementById('syncHint');
  if(h && !h.textContent) h.textContent = 'Loading from Google Sheet…';
  // cache-bust (?t=) + no-store so we NEVER get a stale cached copy from the service worker/browser
  fetch(SCRIPT_URL + '?t=' + Date.now(), {method:'GET', cache:'no-store'})
    .then(r => r.json())
    .then(d => {
      if(!d || !d.ok) throw new Error(d && d.error || 'bad response');
      sheetBalance = Number(d.balance) || 0;
      entries = (d.entries || []).map((e,i) => ({ id:'s'+i, office:e.office, date:e.date, type:e.type,
        category:e.category || (e.type==='cashin'?'Cash In':'Others'), item:e.item, amount:e.amount,
        employee:e.employee||'', source:'', remark:e.remark||'' }));
      localStorage.setItem(KEY, JSON.stringify(entries));
      if(h) h.textContent = '';
      render();
    })
    .catch(()=>{ if(h) h.textContent = ''; });   // stay on cached data if offline
}

function setOffice(o){
  office = o;
  document.getElementById('oKota').classList.toggle('on', o==='kota');
  document.getElementById('oJhal').classList.toggle('on', o==='jhalawar');
  document.getElementById('oSal').classList.toggle('on', o==='salary');
  updateFields();
  render();
}

/* Reconfigure the form for the selected office + type (Salary hides category/employee/source, relabels). */
function updateFields(){
  const sal = office==='salary';
  document.getElementById('tExp').textContent  = sal ? '− Salary Paid' : '− Expense (Kharcha)';
  document.getElementById('tCash').textContent = sal ? '+ Salary Received' : '+ Cash In (Paisa Aaya)';
  document.querySelectorAll('.expense-only').forEach(el=> el.style.display = (type==='expense' && !sal) ? '' : 'none');
  document.getElementById('category').required = (type==='expense' && !sal);
  const lbl = document.getElementById('itemLbl'), item = document.getElementById('item');
  if(sal){
    lbl.innerHTML = 'Name / Particular <span class="req">*</span>'; item.placeholder = 'e.g. Rupesh ji, Krishan Sir';
    if(item.value === 'From Krishan Sir') item.value = '';
  } else if(type==='cashin'){
    lbl.innerHTML = 'Received From / Note <span class="req">*</span>'; item.placeholder = 'e.g. From Krishan Sir';
    if(!item.value) item.value = 'From Krishan Sir';
  } else {
    lbl.innerHTML = 'Item / Particulars <span class="req">*</span>'; item.placeholder = 'e.g. Milk, Petrol, Recharge';
  }
  document.getElementById('cashNote').hidden = !(type==='cashin' && !sal);
}

function setType(t){
  type = t;
  document.getElementById('tExp').classList.toggle('on', t==='expense');
  document.getElementById('tCash').classList.toggle('on', t==='cashin');
  updateFields();
}

let saving = false;   // guard against double-submit (double-tap making 2 rows)
function save(e){
  e.preventDefault();
  if(saving) return false;
  const sal = office==='salary';
  const en = {
    id: Date.now(),
    date: document.getElementById('date').value,
    type,
    // Salary stays in the Salary tab; office cash-in is always added from Kota. All share one balance.
    office: sal ? 'salary' : (type==='cashin' ? 'kota' : office),
    category: sal ? (type==='cashin' ? 'Salary Expences' : 'Salary Paid')
                  : (type==='expense' ? document.getElementById('category').value : 'Cash In'),
    item: document.getElementById('item').value.trim(),
    amount: Math.round(Number(document.getElementById('amount').value)||0),
    employee: (type==='expense' && !sal) ? document.getElementById('employee').value.trim() : '',
    source: (type==='expense' && !sal) ? document.getElementById('source').value.trim() : '',
    remark: document.getElementById('remark').value.trim()
  };
  if(!en.item || en.amount<=0){ return false; }
  saving = true;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  entries.push(en);
  if(sheetBalance !== null) sheetBalance += (en.type==='cashin' ? en.amount : -en.amount);   // optimistic
  persist();
  syncToSheet(en);   // reads the real response; re-enables the button
  document.getElementById('f').reset();
  document.getElementById('date').valueAsDate = new Date();
  setType(type);
  return false;
}


/* balance = money in − money out. ponytail: this-device balance; the Sheet keeps its own via Code.gs. */
function persist(){
  localStorage.setItem(KEY, JSON.stringify(entries));
  render();
}

const curMonth = () => { const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); };
const monthKey = d => (d||'').slice(0,7);              // YYYY-MM
const monthLabel = ym => { const [y,m]=ym.split('-'); return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'}); };
const inOffice = () => entries.filter(e=>(e.office||'kota')===office);   // old entries default to Kota
const officeLabel = () => office==='jhalawar' ? 'Jhalawar' : 'Kota';

/* month dropdown: current month always on top (so a new month starts blank), then months that have data, newest first, + All. */
function populateMonths(){
  const sel = document.getElementById('monthFilter');
  const months = [...new Set(inOffice().map(e=>monthKey(e.date)).filter(Boolean))];
  if(!months.includes(curMonth())) months.push(curMonth());
  months.sort().reverse();
  const keep = sel.value;
  sel.innerHTML = months.map(m=>`<option value="${m}">${monthLabel(m)}${m===curMonth()?' (This month)':''}</option>`).join('')
                + '<option value="all">All Months</option>';
  sel.value = [...sel.options].some(o=>o.value===keep) ? keep : curMonth();
}

function render(){
  populateMonths();
  const sel = document.getElementById('monthFilter').value;

  /* Cash is ONE shared pool: cash-in (always Kota) − all expenses (both offices). Same number for both offices. */
  const sum = arr => arr.reduce((s,e)=>s+e.amount,0);
  const isExp = e => e.type==='expense';
  const cashIn = sum(entries.filter(e=>e.type==='cashin'));
  const kotaOut = sum(entries.filter(e=>isExp(e) && (e.office||'kota')==='kota'));
  const jhalOut = sum(entries.filter(e=>isExp(e) && e.office==='jhalawar'));
  const cash = (sheetBalance !== null) ? sheetBalance : (OPENING_CASH + cashIn - kotaOut - jhalOut);
  document.getElementById('bal').textContent = cash.toLocaleString('en-IN');
  document.getElementById('balLbl').textContent = 'Cash in Hand · Both Offices';
  document.getElementById('sRecv').textContent = rupee(cashIn);
  document.getElementById('sKota').textContent = rupee(kotaOut);
  document.getElementById('sJhal').textContent = rupee(jhalOut);

  /* list below = selected office + month (for review/export) */
  let list = inOffice();
  if(sel!=='all') list = list.filter(e=>monthKey(e.date)===sel);
  document.getElementById('sCount').textContent = list.length;

  const rows = document.getElementById('rows');
  if(!list.length){ rows.innerHTML = '<tr><td colspan="4" class="empty">No entries for this office/month yet.</td></tr>'; return; }
  const sorted = [...list].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || String(b.id).localeCompare(String(a.id)));
  rows.innerHTML = sorted.map(e=>{
    const [bg,fg] = CAT_COLORS[e.category] || CAT_COLORS.Others;
    const meta = [e.employee && ('👤 '+e.employee), e.source, e.remark].filter(Boolean).join(' · ');
    const dObj = e.date ? new Date(e.date+'T00:00') : null;
    const d = (dObj && !isNaN(dObj)) ? dObj.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : (e.date||'');
    return `<tr>
      <td><b>${d}</b></td>
      <td>${esc(e.item)||'—'}${meta?`<div class="sub">${esc(meta)}</div>`:''}</td>
      <td><span class="chip" style="background:${bg};color:${fg}">${esc(e.category)}</span></td>
      <td style="text-align:right" class="${e.type==='cashin'?'amt-cash':'amt-exp'}">${e.type==='cashin'?'+':'−'}${rupee(e.amount)}</td>
    </tr>`;
  }).join('');
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function syncToSheet(en){
  const h = document.getElementById('syncHint');
  const btn = document.getElementById('saveBtn');
  const done = ()=>{ saving=false; if(btn){ btn.disabled=false; btn.textContent='Save Entry'; } };
  if(!SCRIPT_URL){ h.innerHTML = 'Saved on this device. <b>Connect a Google Sheet</b>.'; done(); return; }
  h.textContent = 'Saving to Google Sheet…';
  /* Read the real response (text/plain = no preflight; Apps Script sends CORS headers) so failures aren't silent. */
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(en)})
    .then(r=>r.json())
    .then(d=>{
      if(d && d.ok){
        sheetBalance = Number(d.balance);
        if(d.duplicate){ entries = entries.filter(x=>x.id!==en.id); persist(); h.textContent='↩ Ye entry already saved thi (duplicate skip)'; }
        else { h.textContent='✓ Saved · Cash in Hand ₹'+sheetBalance.toLocaleString('en-IN'); }
        render();
      }
      else { h.innerHTML='⚠ Sheet ne save nahi kiya: '+esc((d&&d.error)||'unknown')+'. Dobara try karo.'; }
      done();
    })
    .catch(()=>{ h.innerHTML='⚠ Internet slow/off — entry device par saved, sheet mein nahi gayi. Net aane par dobara Save karo.'; done(); });
}

/* Excel: exports the selected office + month entries (or All Months). Balance is shared, so the Sheet is the source of truth. */
function exportCSV(){
  const sel = document.getElementById('monthFilter').value;
  let scope = [...inOffice()].sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.id-b.id);
  let tag = officeLabel() + '-' + (sel==='all' ? 'All-Months' : monthLabel(sel).replace(' ','-'));
  if(sel!=='all') scope = scope.filter(e=>monthKey(e.date)===sel);
  if(!scope.length){ alert('No entries to export for this selection.'); return; }
  const head = ['Date','Type','Category','Item / Particulars','Amount','Employee','Remark'];
  const lines = [head];
  scope.forEach(e=>{
    lines.push([e.date, e.type==='cashin'?'Cash In':'Expense', e.category, e.item, e.amount, e.employee, [e.source,e.remark].filter(Boolean).join(' ')]);
  });
  const csv = lines.map(r=>r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Akshardham-Expenses-'+tag+'.csv';

}

/* PWA: register service worker + browser install button (works when hosted on https).
   Auto-heal: when a new version's service worker takes over, reload once so no stale copy lingers. */
if('serviceWorker' in navigator){
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(reloaded) return; reloaded = true; location.reload(); });
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; installBtn.style.display='inline-block'; });
installBtn.onclick = async ()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; installBtn.style.display='none'; };
window.addEventListener('appinstalled', ()=>{ installBtn.style.display='none'; });
</script>
