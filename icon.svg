  <!-- house roof + door, echoing the Akshardham mark -->
  <path d="M130 408 L256 350 L382 408" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="243" y="376" width="26" height="26" rx="3" fill="url(#g)"/>
