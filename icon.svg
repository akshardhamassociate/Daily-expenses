      <stop offset="0" stop-color="#EA5B22"/><stop offset="1" stop-color="#F7B733"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <!-- building skyline, orange->gold, inside the maskable safe zone -->
