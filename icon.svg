  </g>
  <!-- windows on the tallest tower -->
  <g fill="#ffffff" opacity="0.9">
    <rect x="216" y="174" width="10" height="10" rx="2"/><rect x="232" y="174" width="10" height="10" rx="2"/>
    <rect x="216" y="196" width="10" height="10" rx="2"/><rect x="232" y="196" width="10" height="10" rx="2"/>
